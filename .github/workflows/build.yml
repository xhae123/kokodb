name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build :sample:run :benchmarks:run --args=smoke :benchmarks:storageSmoke :comparison:smoke
      - name: Recover sample data in a second JVM
        run: |
          python3 - <<'PY'
          import subprocess, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory(prefix="kokodb-sample-") as directory:
              command = ["./gradlew", ":sample:runPersistent", "--args=" + str(Path(directory) / "app.koko")]
              subprocess.run(command, check=True)
              subprocess.run(command, check=True)
          PY
