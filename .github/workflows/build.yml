name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build :sample:run :benchmarks:run --args=smoke :benchmarks:storageSmoke :comparison:smoke :comparison:differential
      - name: Verify README quickstart and failed-import rollback
        run: ./gradlew :quickstart:run
      - name: Verify isolated engine startup fixtures
        run: |
          ./gradlew :comparison:installDist
          python3 comparison/measure_startup.py --runs 1 --output comparison/results/startup-smoke
      - name: Verify equivalent catalog CLI reports
        run: |
          ./gradlew :catalog-example:installDist
          python3 examples/catalog/measure.py --runs 1 --output .local/catalog-smoke
      - name: Reject malformed SQL in a Gradle consumer
        run: python3 compiler-plugin/check_gradle.py
      - name: Qualify incremental model discovery across Gradle modules
        run: python3 processor/check_gradle.py
      - name: Qualify closed-store backups in fresh JVM consumers
        run: |
          ./gradlew :sample:installDist
          python3 sample/check_backup.py
      - name: Recover sample data in a second JVM
        run: |
          python3 - <<'PY'
          import subprocess, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory(prefix="kokodb-sample-") as directory:
              command = ["./gradlew", ":sample:runPersistent", "--args=" + str(Path(directory) / "app.koko")]
              subprocess.run(command, check=True)
              subprocess.run(command, check=True)
          PY
